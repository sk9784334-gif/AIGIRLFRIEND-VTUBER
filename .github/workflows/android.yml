
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AIGIRLFRIEND-VTUBER-fixed.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -q AIGIRLFRIEND-VTUBER-fixed.zip
          mv AIGIRLFRIEND-VTUBER project

      - name: Build debug APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Girlfriend-VTuber-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
